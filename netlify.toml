[build]
  publish = "."
  command = "bash build.sh"

[build.environment]
  NODE_VERSION = "24"

# The front page is the 3D gallery, built into Gallery/dist by build.sh
[[redirects]]
  from = "/"
  to = "/Gallery/dist/index.html"
  status = 200

# The sitemap is generated by the Gallery build; a sitemap must live at the root to cover the whole site
[[redirects]]
  from = "/sitemap.xml"
  to = "/Gallery/dist/sitemap.xml"
  status = 200
