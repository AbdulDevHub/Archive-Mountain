<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4f2" />
      <stop offset="1" stop-color="#d6eefc" />
    </linearGradient>
    <!-- Rounded tile; set rx to 0 for full-bleed PNG / maskable icons -->
    <clipPath id="tile"><rect width="512" height="512" rx="112" /></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)" />
    <!-- Sea with a turquoise shoreline -->
    <rect y="372" width="512" height="140" fill="#2d8fc4" />
    <path d="M60 372h392" stroke="#7fe3dc" stroke-width="16" stroke-linecap="round" />
    <!-- Mountain (same mark as the site logo), kept inside the maskable safe zone -->
    <g transform="translate(96 96) scale(10)">
      <path d="M2 27 12 9l5 8 3-5 10 15Z" fill="#4c7c5a" />
      <path d="m12 9 3.6 5.8-2.1-1-1.5 2-1.6-2-2.2 1Z" fill="#fff" />
    </g>
  </g>
</svg>
