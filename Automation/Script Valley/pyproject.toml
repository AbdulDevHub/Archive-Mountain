[project]
name = "script-valley"
version = "0.1.0"
description = "Standalone Python automation scripts: story downloader, video loop finder, PDF page merger, WAV to MP3 converter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pdf2image>=1.17.0",
    "pillow>=13.0.0",
    "requests>=2.34.2",
]

[tool.ruff]
line-length = 110

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
