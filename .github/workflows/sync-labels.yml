# Keeps the scoped label scheme on every new or recently pushed repo, hands-free.
# Runs daily; repos that already match are skipped, so it's cheap and idempotent.
#
# One-time setup: add a repo secret named LABELS_TOKEN (Settings → Secrets → Actions)
# holding a fine-grained PAT with "All repositories" access and
# Repository permissions: Issues = Read and write, Metadata = Read-only.
# (A classic PAT with the `repo` scope also works.)
name: Sync Labels

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      since:
        description: 'Only repos pushed in the last N days ("all" = every repo)'
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: sync-labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check token
        env:
          LABELS_TOKEN: ${{ secrets.LABELS_TOKEN }}
        run: |
          if [ -z "$LABELS_TOKEN" ]; then
            echo "::error::LABELS_TOKEN secret is missing. See the setup comment at the top of this workflow."
            exit 1
          fi

      - name: Apply label scheme to outdated repos
        env:
          GH_TOKEN: ${{ secrets.LABELS_TOKEN }}
          # Scheduled runs (no inputs) use 3 days; "all" checks every repo
          SINCE: ${{ inputs.since || '3' }}
        run: |
          args=(--only-outdated)
          [ "$SINCE" != "all" ] && args+=(--since "$SINCE")
          bash "GitHub Valley/update-all-labels.sh" "${args[@]}"
